# Alembic configuration for the Damas Super AI knowledge base (G11, ADR-013).
# The database URL comes from DAMAS_DATABASE_URL (see alembic/env.py); the value below is only a
# local default.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///var/damas_kb.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
