# Engine definitions - EXAMPLE. Copy to config/engines.toml (git-ignored) and edit.
# Point DAMAS_ENGINES_CONFIG at the copy. Executable paths can also be supplied per engine
# through DAMAS_ENGINE_<ID>_EXECUTABLE (for example DAMAS_ENGINE_SCAN_EXECUTABLE).
#
# IMPORTANT (G1 finding): none of the engines below plays Brazilian 8x8 draughts.
# `native_variant` records what each engine actually plays. See
# docs/architecture/rules-compatibility.md before enabling anything.
#
# No engine binary is distributed with this repository (ADR-004). Obtain each one yourself
# from its author, under the author's terms.

[engines.scan]
enabled = false
protocol = "hub"                       # Hub protocol v2 (protocol.txt of Scan 3.1)
executable = "REPLACE/WITH/PATH/TO/scan.exe"
args = ["hub"]                         # Scan only speaks Hub when launched with "hub"
# working_dir defaults to the executable's folder: Scan reads scan.ini and data/ from the CWD.
native_variant = "international-10x10"
init_timeout_s = 180                   # bitbase loading can be slow
search_timeout_s = 60                  # extra time beyond the search limit before 'stop' is sent
stop_grace_s = 5                       # wait for 'done' after 'stop', then kill (ADR-007)
quit_timeout_s = 5
# env = { }                            # extra environment variables, if the engine needs any

[engines.scan.params]                  # sent as `set-param name=... value=...` before `init`
variant = "normal"                     # Scan 3.1 values: normal killer bt frisian losing (all 10x10)
book = "false"

[engines.kingsrow_intl_hub]
enabled = false
protocol = "hub"                       # Kingsrow hub 1.63: Hub 2.1 (verified G5); move-time limits only
executable = "REPLACE/WITH/PATH/TO/kr_hub.exe"   # from kr_hub_163.zip; no args; CWD = its folder
native_variant = "international-10x10"

[engines.kingsrow_intl_hub.params]
egdb-wld = "false"                     # default ini points at a db path that usually does not exist
book = "false"
threads = "1"

# The platform's own engine (G8, ADR-010): our code, so it can run anywhere Python runs.
# One process per variant. The executable is the Python interpreter; PYTHONPATH must reach
# backend/src.
[engines.damasai_br]
enabled = false
protocol = "hub"
executable = "REPLACE/WITH/PATH/TO/python.exe"
args = ["-m", "damas_ai.search.hub"]
native_variant = "brazilian-8x8"        # the only engine here that plays Brazilian
env = { PYTHONPATH = "REPLACE/WITH/PATH/TO/backend/src" }

[engines.damasai_br.params]
variant = "brazilian"

# Out of scope under ADR-005 option A (wrong rules for Brazilian; needs a DLL host). Reference only.
[engines.kingsrow_english]
enabled = false
protocol = "cb-dll"                    # CheckerBoard engine DLL (Windows only, in-process API)
executable = "REPLACE/WITH/PATH/TO/kingsrow64.dll"
native_variant = "english-8x8"
